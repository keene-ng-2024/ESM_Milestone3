trigger:
  - main
  - fix/sync-filestore-dump

stages:
  - stage: Staging
    displayName: 'Deploy to Staging'
    pool:
      name: Staging
    variables:
      PROJECT_DIR: ~/ESM_Milestone3
      DOMAIN: esmos-staging.koreacentral.cloudapp.azure.com
    jobs:
      - job: Deploy
        steps:
          - script: |
              cd $(PROJECT_DIR)
              sudo chown -R $(whoami) odoo/filestore || true
              git checkout -- . || true
              git clean -fd odoo/filestore || true
              BRANCH=$(echo "$(Build.SourceBranch)" | sed 's|refs/heads/||')
              git checkout "$BRANCH"
              git pull origin "$BRANCH"
            displayName: 'Pull latest code'

          - script: |
              cd $(PROJECT_DIR)
              if [ ! -f nginx/certs/fullchain.pem ]; then
                echo "No SSL certs found, generating self-signed..."
                mkdir -p nginx/certs
                openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                  -keyout nginx/certs/privkey.pem \
                  -out nginx/certs/fullchain.pem \
                  -subj "/CN=$(DOMAIN)/O=ESMOS/C=SG"
              else
                echo "SSL certs already exist, skipping."
              fi
            displayName: 'Ensure SSL certs exist'

          - script: |
              cd $(PROJECT_DIR)
              docker compose down
              docker compose up -d --build
            displayName: 'Deploy containers'

          - script: |
              echo "Waiting for services to start..."
              sleep 30
              cd $(PROJECT_DIR)
              docker compose ps
              RUNNING=$(docker compose ps --format json | grep -c '"running"')
              EXPECTED=5
              if [ "$RUNNING" -lt "$EXPECTED" ]; then
                echo "WARNING: Only $RUNNING/$EXPECTED containers running"
                docker compose logs --tail=20
                exit 1
              fi
              echo "All $RUNNING containers are running."
            displayName: 'Health check'

          - script: |
              cd $(PROJECT_DIR)
              docker exec -u root esm_milestone3-odoo-1 chown -R odoo:odoo /var/lib/odoo/filestore || true
              docker exec -i esm_milestone3-odoo-db-1 psql -U odoo17 odoo -c \
                "UPDATE ir_config_parameter SET value = 'https://$(DOMAIN)' WHERE key = 'web.base.url';"
              docker exec -i esm_milestone3-odoo-db-1 psql -U odoo17 odoo -c \
                "INSERT INTO ir_config_parameter (key, value, create_uid, create_date, write_uid, write_date) \
                 VALUES ('web.base.url.freeze', 'True', 1, NOW(), 1, NOW()) \
                 ON CONFLICT (key) DO UPDATE SET value = 'True';"
              docker exec -i esm_milestone3-odoo-db-1 psql -U odoo17 odoo -c \
                "DELETE FROM ir_attachment WHERE res_model = 'ir.ui.view' AND name LIKE 'web.assets_%';"
              docker compose restart odoo
            displayName: 'Configure Odoo'

          - script: |
              cd $(PROJECT_DIR)
              MOODLE_CONTAINER=$(docker compose ps -q moodle | head -1)
              docker exec "$MOODLE_CONTAINER" sed -i "s|\$CFG->wwwroot.*=.*'.*';|\$CFG->wwwroot   = 'https://$(DOMAIN):8443';|" /var/www/html/config.php
              docker exec "$MOODLE_CONTAINER" grep -q "sslproxy" /var/www/html/config.php || \
                docker exec "$MOODLE_CONTAINER" sed -i "/wwwroot/a \$CFG->sslproxy  = true;" /var/www/html/config.php
              docker compose restart moodle
            displayName: 'Configure Moodle'

          - script: |
              cd $(PROJECT_DIR)
              STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" https://localhost/)
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "303" ]; then
                echo "Odoo is responding (HTTP $STATUS)"
              else
                echo "Odoo returned unexpected status: $STATUS"
                exit 1
              fi
              STATUS=$(curl -k -o /dev/null -s -w "%{http_code}" https://localhost:8443/)
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "303" ]; then
                echo "Moodle is responding (HTTP $STATUS)"
              else
                echo "Moodle returned unexpected status: $STATUS"
                exit 1
              fi
              echo "Staging deployment successful!"
            displayName: 'Verify deployment'

  - stage: Production
    displayName: 'Deploy to Production'
    dependsOn: Staging
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    pool:
      name: Default
    variables:
      PROJECT_DIR: ~/ESM_Milestone3
