services:

  odoo:
    image: odoo:17.0
    depends_on:
      - odoo-db
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo/custom-addons/helpdesk:/mnt/extra-addons
      - ./odoo/filestore:/var/lib/odoo/filestore
    command: -- --proxy-mode
    environment:
      - HOST=odoo-db
      - USER=odoo17
      - PASSWORD=2140doo
    restart: unless-stopped
    networks:
      - esmos_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  odoo-db:
    image: postgres:15
    command: postgres -c max_connections=200 -c shared_buffers=256MB
    environment:
      - POSTGRES_DB=odoo
      - POSTGRES_USER=odoo17
      - POSTGRES_PASSWORD=2140doo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
      - ./odoo_backup.sql:/docker-entrypoint-initdb.d/odoo_backup.sql
    restart: unless-stopped
    networks:
      - esmos_network

  moodle:
    build:
      context: ./moodle
      dockerfile: Dockerfile
    depends_on:
      moodle-db:
        condition: service_healthy
    volumes:
      - moodle_data:/var/www/html
      - moodle_appdata:/var/www/moodledata
    environment:
      - MOODLE_DB_TYPE=mariadb
      - MOODLE_DB_HOST=moodle-db
      - MOODLE_DB_PORT=3306
      - MOODLE_DB_NAME=moodle
      - MOODLE_DB_USER=moodle
      - MOODLE_DB_PASS=moodle2140
      - MOODLE_SITE_URL=https://esmos-e08g09t05.koreacentral.cloudapp.azure.com:8443
      - MOODLE_SITE_FULLNAME=ESMOS Training
      - MOODLE_SITE_SHORTNAME=ESMOS
      - MOODLE_ADMIN_USER=admin
      - MOODLE_ADMIN_PASS=moodle2140
      - MOODLE_ADMIN_EMAIL=admin@esmos.internal
    restart: unless-stopped
    networks:
      - esmos_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  moodle-db:
    image: mariadb:10.6
    environment:
      - MYSQL_ROOT_PASSWORD=root2140
      - MYSQL_DATABASE=moodle
      - MYSQL_USER=moodle
      - MYSQL_PASSWORD=moodle2140
    volumes:
      - moodle_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - esmos_network

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - odoo
      - moodle
    restart: unless-stopped
    networks:
      - esmos_network

volumes:
  odoo_data:
  odoo_db_data:
  moodle_data:
  moodle_appdata:
  moodle_db_data:

networks:
  esmos_network:
    driver: bridge
