# HTTP → HTTPS redirect (all traffic)
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

# Odoo (public, port 443)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    add_header X-Deployed-By "Azure-Pipeline" always;

    # Re-resolve Docker service names on each request for round-robin across replicas
    resolver 127.0.0.11 valid=5s;

    # Health check — single resolve is fine, not under load
    location = /health {
        access_log off;
        proxy_pass http://odoo:8069/web/health;
        proxy_set_header Host $host;
    }

    # Odoo main
    location / {
        set $odoo_backend http://odoo:8069;
        proxy_pass $odoo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }

    # Odoo websocket
    location /websocket {
        set $odoo_bus http://odoo:8072;
        proxy_pass $odoo_bus;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Odoo longpolling
    location /longpolling {
        set $odoo_lp http://odoo:8072;
        proxy_pass $odoo_lp;
    }
}

# Moodle (internal only, port 8443 — restrict via Azure NSG)
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Re-resolve Docker service names on each request for round-robin across replicas
    resolver 127.0.0.11 valid=5s;

    # Health check — single resolve is fine, not under load
    location = /health {
        access_log off;
        proxy_pass http://moodle:80/login/index.php;
        proxy_set_header Host $host:8443;
        proxy_intercept_errors on;
        error_page 301 302 303 = @moodle_healthy;
    }
    location @moodle_healthy {
        return 200 "OK";
    }

    location / {
        set $moodle_backend http://moodle:80;
        proxy_pass $moodle_backend;
        proxy_set_header Host $host:8443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 8443;
    }
}
